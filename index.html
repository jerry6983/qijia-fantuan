<style>

  .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); }
  .row:first-of-type { border-top: 0; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 6px; }

      <tr data-d="0"><td>週日</td><td>06:50 – 12:30</td></tr>

  </section>

<script>
(function () {
  // 以台灣時間計算今天與目前是否營業
  var now = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Taipei' }));
  var d = now.getDay(), m = now.getHours() * 60 + now.getMinutes();
  var row = document.querySelector('#hours tr[data-d="' + d + '"]');
  if (row) row.classList.add('today');
  var open = d === 1 ? null : (d === 0 || d === 6 ? 6 * 60 + 50 : 6 * 60 + 30);
  var close = 12 * 60 + 30;
  var el = document.getElementById('status');
  var isOpen = open !== null && m >= open && m < close;
  el.textContent = isOpen ? '營業中・12:30 打烊' : (d === 1 ? '今天公休' : (m < (open || 0) ? '今天 ' + (d === 0 || d === 6 ? '06:50' : '06:30') + ' 開門' : '今天已打烊'));
  el.classList.toggle('closed', !isOpen);
  el.hidden = false;
})();
</script>
